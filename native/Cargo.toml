[package]
name = "crg-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-python = "0.25.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
