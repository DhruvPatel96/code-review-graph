name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  native-wheels:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-arm64
          - windows-x86_64
          - windows-arm64
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-14
          - platform: windows-x86_64
            os: windows-latest
          - platform: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native ABI3 wheel
        shell: bash
        run: |
          python -m pip install maturin
          maturin build --release --manifest-path native/Cargo.toml --out wheelhouse
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse/*.whl

  python-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-fallback
          path: dist/*

  publish:
    needs: [native-wheels, python-fallback]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - run: python -m pip install twine
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
